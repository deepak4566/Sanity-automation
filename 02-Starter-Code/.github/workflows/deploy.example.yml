# EXAMPLE ONLY: how to hook the sanity suite into an EXISTING deploy workflow.
# Copy the `sanity` job (and the `outputs`) into your real workflow; don't commit this file as-is.
# Starting from scratch? Use ci-cd.yml instead.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, qa, staging, prod]
        default: qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        run: |
          echo "...your existing deploy steps..."
          echo "url=${{ vars.BASE_URL }}" >> "$GITHUB_OUTPUT"

  # ---- add this job ----
  sanity:
    needs: deploy
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: ${{ inputs.environment || 'qa' }}
      base_url: ${{ needs.deploy.outputs.url }}
      ref: ${{ github.sha }}
    secrets: inherit

  # ---- and gate whatever comes next on it ----
  # promote:
  #   needs: sanity
  #   ...
