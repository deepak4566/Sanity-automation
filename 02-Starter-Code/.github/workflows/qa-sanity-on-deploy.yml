# OPTIONAL: zero-touch trigger when you can't edit the deploy workflow.
# Fires automatically after the named workflow finishes successfully.
# Do NOT use together with a `sanity` job in the deploy workflow (it would run twice).
# Caveat: this runs *after* the other workflow, so it cannot stop that workflow's own
# promotion; the failing run + email is the signal. Use ci-cd.yml for hard blocking.
# workflow_run only fires for workflow files on the default branch.
name: QA Sanity (after deploy)

on:
  workflow_run:
    workflows: ["Deploy QA"] # exact `name:` of the workflow that deploys to QA
    types: [completed]

jobs:
  sanity:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: qa
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
