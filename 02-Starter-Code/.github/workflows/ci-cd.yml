# Complete pipeline:
#   build -> deploy QA -> sanity (automatic) -> [gate] -> deploy staging -> sanity -> [gate] -> deploy prod
#
# "[gate]" = the sanity job fails when a @critical test fails, so the next deploy job
# (needs: sanity-...) never starts. Fix the problem, then re-run the workflow
# (Actions -> run -> "Re-run failed jobs", or push a fix).
# For a human review step as well, add "Required reviewers" to the staging / prod
# environments (Settings -> Environments).
#
# Replace the `echo` placeholders with your real build and deploy steps.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "TODO - install, lint, unit tests, build"'

  deploy-qa:
    needs: build
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        run: |
          echo "TODO: deploy ${{ github.sha }} to QA"
          echo "url=${{ vars.BASE_URL }}" >> "$GITHUB_OUTPUT"

  # Runs automatically after every successful QA deployment
  sanity-qa:
    needs: deploy-qa
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: qa
      base_url: ${{ needs.deploy-qa.outputs.url }}
      ref: ${{ github.sha }}
    secrets: inherit

  # Blocked automatically if sanity-qa failed its gate
  deploy-staging:
    needs: sanity-qa
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        run: |
          echo "TODO: deploy ${{ github.sha }} to STAGING"
          echo "url=${{ vars.BASE_URL }}" >> "$GITHUB_OUTPUT"

  sanity-staging:
    needs: deploy-staging
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: staging
      base_url: ${{ needs.deploy-staging.outputs.url }}
      ref: ${{ github.sha }}
    secrets: inherit

  deploy-prod:
    needs: sanity-staging
    runs-on: ubuntu-latest
    environment: prod # add Required reviewers on this environment for a manual approval
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "TODO - deploy ${{ github.sha }} to PROD"'
