# Post-deploy QA sanity suite (reusable)
# Runs the Playwright @sanity tests against a freshly deployed environment, emails a
# PASS/FAIL report (with failed-test details) and enforces the PROMOTION GATE:
# if any @critical test fails (or no results are produced) this job FAILS, so any job
# that has `needs: <this job>` (e.g. deploy to the next environment) does not run.
#
# Triggers:
#   1. workflow_call      -> called from ci-cd.yml / your deploy workflow (recommended)
#   2. workflow_dispatch  -> manual run from the Actions tab
#   (zero-touch alternative for a separate deploy workflow: qa-sanity-on-deploy.yml)
name: Post-Deploy Sanity

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment that was just deployed (dev / qa / staging / prod)"
        required: true
        type: string
      base_url:
        description: "URL of the deployed app. Falls back to the environment's BASE_URL variable."
        required: false
        type: string
        default: ""
      ref:
        description: "Commit SHA that was deployed (defaults to the triggering commit)"
        required: false
        type: string
        default: ""
    outputs:
      status:
        description: "PASS | FAIL | ERROR"
        value: ${{ jobs.sanity.outputs.status }}
      gate:
        description: "OPEN | BLOCKED"
        value: ${{ jobs.sanity.outputs.gate }}
    # Secrets come from the caller via `secrets: inherit`

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        required: true
        default: "qa"
        type: choice
        options: [dev, qa, staging, prod]
      base_url:
        description: "Override URL (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sanity-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sanity:
    name: Sanity (${{ inputs.environment }})
    # Execution runner: set repo variable SANITY_RUNNER to a self-hosted runner label
    # (e.g. "qa-runner" for a runner inside your VPN); defaults to GitHub-hosted.
    runs-on: ${{ vars.SANITY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }} # environment-specific BASE_URL, secrets, recipients
    outputs:
      status: ${{ steps.summary.outputs.status || 'ERROR' }}
      gate: ${{ steps.summary.outputs.gate || 'BLOCKED' }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}
      SANITY_USER: ${{ secrets.SANITY_USER }}
      SANITY_PASSWORD: ${{ secrets.SANITY_PASSWORD }}
      CI: "true"

    steps:
      - name: Checkout (the deployed commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment to be reachable
        id: wait
        run: |
          echo "Target: $TARGET_ENV -> $BASE_URL"
          if [ -n "$BASE_URL" ]; then
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 "$BASE_URL" || true)
              if [ "${code:-0}" -ge 200 ] && [ "${code:-0}" -lt 500 ]; then
                echo "Up ($code)"; echo "reachable=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "Attempt $i: HTTP $code, retrying in 15s"; sleep 15
            done
          else
            echo "::error::BASE_URL is not set for environment '$TARGET_ENV'"
          fi
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::App not reachable; running tests anyway so the failure is reported"

      - name: Run sanity suite
        id: tests
        continue-on-error: true # always build the report and send the email first
        run: npx playwright test --grep @sanity

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-report-${{ env.TARGET_ENV }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build email summary
        id: summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          TRIGGERED_BY: ${{ github.actor }}
          APP_REACHABLE: ${{ steps.wait.outputs.reachable }}
          GATE_MODE: ${{ vars.SANITY_GATE_MODE || 'critical' }} # critical | any
        run: node scripts/build-report.mjs results/results.json

      - name: Email report (success and failure)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.SANITY_EMAIL_FROM || secrets.SMTP_USERNAME }}
          to: ${{ vars.SANITY_EMAIL_RECIPIENTS }}
          subject: ${{ steps.summary.outputs.subject || format('⚠️ [Sanity ERROR] {0} — report could not be built — PROMOTION BLOCKED', env.TARGET_ENV) }}
          # Falls back to a plain body if the report script itself crashed
          body: Sanity report could not be generated. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: ${{ steps.summary.outputs.status != '' && 'file://email-body.html' || '' }}

      - name: Write job summary
        if: always()
        run: cat email-body.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Enforce promotion gate
        if: always() && steps.summary.outputs.gate != 'OPEN'
        run: |
          echo "::error::Sanity ${{ steps.summary.outputs.status || 'ERROR' }} — promotion to the next environment is BLOCKED until the failure is reviewed."
          exit 1

      - name: Warn on non-blocking failures
        if: always() && steps.summary.outputs.gate == 'OPEN' && steps.summary.outputs.status == 'FAIL'
        run: echo "::warning::Non-critical sanity tests failed. Promotion is allowed, but please review the report."
