# Full CI/CD Pipeline with Automated Post-Deploy QA Sanity & Promotion Gate
#
# Execution Flow:
#   push (main) -> build -> deploy-qa -> sanity-qa ──[gate]──► deploy-staging -> sanity-staging ──[gate]──► deploy-prod
#                                           │
#                                           ├─► Playwright @sanity suite
#                                           ├─► HTML report / traces / video artifacts
#                                           ├─► Email report (PASS / FAIL / BLOCKED)
#                                           └─► Enforces gate: any @critical failure BLOCKS promotion
#
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate code syntax
        run: node -c src/server.js scripts/build-report.mjs

  deploy-qa:
    name: Deploy to QA
    needs: build
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy QA Application
        id: deploy
        run: |
          echo "Simulating deployment of commit ${{ github.sha }} to QA environment..."
          # If an external QA URL is defined in repo/environment variables, output it.
          # Otherwise default to http://localhost:3000 where Playwright starts the demo server.
          TARGET="${{ vars.BASE_URL }}"
          if [ -z "$TARGET" ]; then
            TARGET="http://localhost:3000"
          fi
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Successfully deployed to QA: $TARGET"

  # Triggered automatically after QA deployment
  sanity-qa:
    name: QA Post-Deploy Sanity
    needs: deploy-qa
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: qa
      base_url: ${{ needs.deploy-qa.outputs.url }}
      test_suite: "@sanity"
      suite_name: "Sanity"
      ref: ${{ github.sha }}
    secrets: inherit

  # Promotion to Staging is BLOCKED if sanity-qa fails its gate
  deploy-staging:
    name: Deploy to Staging
    needs: sanity-qa
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Staging Application
        id: deploy
        run: |
          echo "Sanity gate PASSED. Promoting commit ${{ github.sha }} to STAGING..."
          TARGET="${{ vars.BASE_URL }}"
          if [ -z "$TARGET" ]; then
            TARGET="http://localhost:3000"
          fi
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Successfully deployed to Staging: $TARGET"

  sanity-staging:
    name: Staging Post-Deploy Sanity
    needs: deploy-staging
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: staging
      base_url: ${{ needs.deploy-staging.outputs.url }}
      test_suite: "@sanity"
      suite_name: "Sanity"
      ref: ${{ github.sha }}
    secrets: inherit

  # Production deployment: requires staging sanity pass (+ optional environment manual reviewer approval)
  deploy-prod:
    name: Deploy to Production
    needs: sanity-staging
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Production Application
        run: |
          echo "Staging sanity gate PASSED. Promoting commit ${{ github.sha }} to PRODUCTION..."
          echo "Production deployment completed successfully."
