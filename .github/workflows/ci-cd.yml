# CI/CD Pipeline: Pre-Deploy Sanity Gate & Automated QA Branch Promotion
#
# Execution Flow:
#   push (main) ──► build ──► sanity-gate ──[PROMOTION GATE]──► deploy-qa (merge main -> qa branch)
#                                │                                      ▲
#                                │                                      │ (ONLY executes if gate is OPEN)
#                                ├─► Playwright @sanity suite           │
#                                ├─► HTML report / traces / video       │
#                                ├─► Email report (PASS / FAIL)         │
#                                └─► If @critical fails: BLOCKS MERGE ──┘
#
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate code syntax
        run: node -c src/server.js scripts/build-report.mjs

  # 1. Run Sanity Suite FIRST before promoting or merging to QA
  sanity-gate:
    name: Pre-Deploy Sanity Gate
    needs: build
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: qa
      base_url: "http://localhost:3000"
      test_suite: "@sanity"
      suite_name: "Sanity"
      ref: ${{ github.sha }}
    secrets: inherit

  # 2. Deploy to QA (merges main into qa branch) ONLY IF all sanity tests passed
  deploy-qa:
    name: Deploy to QA (Merge to QA Branch)
    needs: sanity-gate
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout code (full commit history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into qa branch and push
        run: |
          echo "================================================================"
          echo "✅ All Sanity tests PASSED! Promoting ${{ github.sha }} to QA..."
          echo "================================================================"
          
          git fetch origin
          
          # Check out or create qa branch
          if git show-ref --verify --quiet refs/remotes/origin/qa; then
            git checkout qa
            git pull origin qa
          else
            git checkout -b qa
          fi
          
          # Merge main (the verified commit) into qa branch
          git merge ${{ github.sha }} -m "deploy: promote commit ${{ github.sha }} to QA branch [sanity passed]"
          
          # Push the updated qa branch
          git push origin qa
          
          echo "🚀 Successfully merged to 'qa' branch and deployed to QA environment!"
