# Weekly Regression Tests Workflow
# Runs weekly (7-day cadence via cron) for in-depth system verification and edge case validation.
name: Weekly Regression Tests

on:
  schedule:
    # Runs weekly every Sunday at 00:00 UTC (every 1 week)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to test"
        required: true
        default: "qa"
        type: choice
        options: [dev, qa, staging, prod]

permissions:
  contents: read

jobs:
  regression-tests:
    name: Run Regression Suite
    uses: ./.github/workflows/post-deploy-sanity.yml
    with:
      environment: ${{ inputs.environment || 'qa' }}
      test_suite: "@regression"
      suite_name: "Regression"
      ref: ${{ github.sha }}
    secrets: inherit
